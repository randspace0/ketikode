<!DOCTYPE html>
<html lang="en">
  <head>
    {{ template "header" . }}
  </head>
  <body>
    {{ template "navbar" . }}
    <section class="section" id="main" tabindex="-1">
      <div class="container">
        <h1 class="title is-4">Write code, run it, share the result</h1>
        <form id="form" method="POST" action="/code/create">
          <div class="field">
            <span class="label">Source code</span>
            <textarea style="display: none;" name="code"></textarea>
            <div id="editor"></div>
            <script src="/static/vendor/ace.js"></script>
            <script src="/static/vendor/theme-dracula.js"></script>
            <script>
              let editor = ace.edit("editor");
              let textarea = document.querySelector("textarea[name=\"code\"]");

              editor.setTheme("ace/theme/dracula");
              ace.config.set("basePath", "/static/vendor");

              // Syntax highlighting follows the selected language.
              const modes = { c: "c_cpp", cpp: "c_cpp", python3: "python", java: "java", ruby: "ruby", rust: "rust" };
              // The select comes later in the page, so wait for it.
              document.addEventListener("DOMContentLoaded", () => {
                const language = document.querySelector("select[name=\"language\"]");
                const setMode = () => editor.session.setMode("ace/mode/" + modes[language.value]);
                language.addEventListener("change", setMode);
                setMode();
              });
              editor.setOption("fontFamily", "JetBrains Mono, ui-monospace, Menlo, Consolas, monospace");
              editor.getSession().on("change", function () {
                textarea.value = editor.getSession().getValue();
              });
            </script>
          </div>
          <div class="field is-hidden" id="field-stdin">
            <label class="label" for="stdin">Standard input</label>
            <div class="control">
              <textarea id="stdin" name="stdin" class="textarea" rows="3" placeholder="Input your program reads, if any"></textarea>
            </div>
          </div>
          <div class="field is-grouped is-grouped-multiline run-bar">
            <div class="control">
              <label class="is-sr-only" for="language">Language</label>
              <div class="select">
                <select id="language" name="language">
                  <option value="cpp">C++</option>
                  <option value="c">C</option>
                  <option value="python3">Python 3</option>
                  <option value="java">Java</option>
                  <option value="ruby">Ruby</option>
                  <option value="rust">Rust</option>
                </select>
              </div>
            </div>
            <div class="control">
              <button type="button" id="button-stdin" class="button" aria-expanded="false" aria-controls="field-stdin">Input</button>
            </div>
            <div class="control">
              <button type="submit" id="button-run" class="button is-primary">Run</button>
            </div>
          </div>
        </form>
      </div>
    </section>
    <!-- Begin additional javascript -->
    <script src="/static/js/main.js"></script>
    <script src="/static/js/home.js"></script>
  </body>
</html>
