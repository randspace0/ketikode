<!DOCTYPE html>
<html>
  <head>
    {{ template "header" . }}
  </head>
  <body>
    {{ template "navbar" . }}
    <section class="section">
      <div class="container">
        <h1 class="title">
          Statistics by Programming Language
        </h1>
        <canvas id="chart"></canvas>
      </div>
    </section>
    <!-- Begin additional javascript -->
    <script src="/static/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.8.0/dist/Chart.min.js" integrity="sha384-QzN1ywg2QLsf72ZkgRHgjkB/cfI4Dqjg6RJYQUqH6Wm8qp/MvmEYn+2NBsLnhLkr" crossorigin="anonymous"></script>
    <script>
        function hashCode(str) { // java String#hashCode
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return hash;
        } 

        function intToRGB(i){
            let c = (i & 0x00FFFFFF)
                .toString(16)
                .toUpperCase();

            return "00000".substring(0, 6 - c.length) + c;
        }

        let ctx = document.getElementById('chart').getContext('2d');
        let chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ["Total"],
                datasets: [
                    {{ range $key, $value := .languages }}
                    {
                        data: [{{ $value }}],
                        backgroundColor: "#" + intToRGB(hashCode("{{ $key }}")),
                        borderColor: "rgba(136,136,136,0.5)",
                        label: "{{ $key }}",
                    },
                    {{ end }}
                ]
            },
            options: {}
        });
    </script>
  </body>
</html>
